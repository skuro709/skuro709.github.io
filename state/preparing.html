<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Official Social Media</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            background: #101010;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Helvetica Neue",
                Arial,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 24px;
        }

        .container {
            width: 100%;
            max-width: 760px;
            text-align: center;
        }

        .eyebrow {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            color: #aaaaaa;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #ffffff;
            border-radius: 50%;
        }

        .line {
            width: 100%;
            height: 1px;
            background: #333333;
        }

        .content {
            padding: 90px 0;
        }

        .label {
            color: #888888;
            font-size: 11px;
            letter-spacing: 5px;
            margin-bottom: 28px;
        }

        h1 {
            font-size: clamp(38px, 8vw, 76px);
            font-weight: 500;
            letter-spacing: 3px;
            line-height: 1.2;
            margin-bottom: 30px;
        }

        .accent {
            width: 36px;
            height: 2px;
            background: #ffffff;
            margin: 0 auto 30px;
        }

        .message {
            color: #cccccc;
            font-size: clamp(13px, 2vw, 16px);
            line-height: 2;
            letter-spacing: 0.5px;
        }

        .sub-message {
            color: #777777;
            font-size: 13px;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        .footer {
            padding-top: 25px;
            color: #666666;
            font-size: 10px;
            letter-spacing: 3px;
            line-height: 2;
        }

        @media (max-width: 480px) {
            .content {
                padding: 70px 0;
            }

            .eyebrow {
                font-size: 9px;
                letter-spacing: 2px;
            }

            h1 {
                letter-spacing: 1px;
            }

            .message {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header class="eyebrow">
            <span class="dot"></span>
            <span>OFFICIAL SOCIAL MEDIA</span>
        </header>

        <div class="line"></div>

        <section class="content">
            <p class="label">Social Design Collective</p>
            <h1>COMING SOON.</h1>
            <div class="accent"></div>
            <p class="message">
                We are preparing our official accounts.
            </p>
            <p class="sub-message">
                Stay tuned for updates.
            </p>
        </section>

        <div class="line"></div>

        <footer class="footer">
            OFFICIAL WEBSITE / SOCIAL MEDIA
        </footer>
    </main>
</body>
</html>
