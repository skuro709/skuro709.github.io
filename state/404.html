<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #080808;
            color: #f0f0f0;
            font-family: Consolas, "Courier New", monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(255, 255, 255, 0.025) 4px
            );
            pointer-events: none;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 30px 10px;
        }

        .status {
            color: #ff3030;
            font-size: clamp(14px, 2vw, 20px);
            letter-spacing: 8px;
            margin-bottom: 20px;
        }

        .code {
            font-size: clamp(100px, 25vw, 240px);
            font-weight: bold;
            line-height: 1;
            color: #ff3030;
            text-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
        }

        .message {
            font-size: clamp(20px, 5vw, 44px);
            letter-spacing: 5px;
            margin-top: 20px;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #333;
            margin: 35px 0 25px;
        }

        .details {
            color: #777;
            font-size: clamp(11px, 1.5vw, 14px);
            line-height: 2;
            text-align: left;
            display: inline-block;
        }

        .error {
            color: #ff3030;
        }

        .footer {
            margin-top: 35px;
            color: #444;
            font-size: 11px;
            letter-spacing: 3px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #ff3030;
            margin-left: 5px;
            animation: blink 1s steps(2) infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>

<body>
    <main class="container">

        <div class="status">SYSTEM ERROR // HTTP RESPONSE</div>

        <div class="code">404</div>

        <div class="message">NOT FOUND</div>

        <div class="divider"></div>

        <div class="details">
            <div>HTTP/1.1 <span class="error">404 Not Found</span></div>
            <div>STATUS : <span class="error">FAILED</span></div>
            <div>REQUEST : RESOURCE NOT FOUND</div>
            <div>SERVER  : RESPONSE COMPLETE</div>
            <div>ERROR   : THE REQUESTED URL WAS NOT FOUND<span class="cursor"></span></div>
        </div>

        <div class="footer">
            END OF RESPONSE // CONNECTION CLOSED
        </div>

    </main>
</body>
</html>
